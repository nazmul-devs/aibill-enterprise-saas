version: '3.8'

services:
  postgres_dev:
    image: postgres:16-alpine
    container_name: aibill_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev200404
      POSTGRES_DB: aibill_dev_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data


  redis_dev:
    image: redis:7-alpine
    container_name: aibill_redis_dev
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data



  pgadmin_dev:
    image: dpage/pgadmin4
    container_name: aibill_pgadmin_dev
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aibill.local
      PGADMIN_DEFAULT_PASSWORD: 200404
    ports:
      - "8080:80"
    depends_on:
      - postgres_dev

volumes:
  postgres_dev_data:
  redis_dev_data:
